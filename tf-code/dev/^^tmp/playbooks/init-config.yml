---
- hosts: all
  become: yes
  gather_facts: no
  tasks:
    # - name: Wait for SSH connection
    #   wait_for_connection:
    #     timeout: 300
  
    - name: Set password for ubuntu user
      user:
        name: ubuntu
        password: "{{ 'Ubuntu' | password_hash('sha512') }}"

    - name: Set timezone
      timezone:
        name: Asia/Ho_Chi_Minh

    - name: Set hostname
      hostname:
        name: "{{ hostname }}"

    - name: Disable swap
      shell: swapoff -a

    - name: Comment out swap in fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*$)'
        replace: '#\1'

    - name: Configure kernel parameters
      copy:
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
        dest: /etc/sysctl.d/k8s.conf

    - name: Load kernel modules
      copy:
        content: |
          br_netfilter
          overlay
        dest: /etc/modules-load.d/k8s.conf

    - name: Load br_netfilter modules
      modprobe:
        name: br_netfilter

    - name: Load overlay module
      modprobe:
        name: overlay

    - name: Apply sysctl settings
      shell: sysctl --system